[project]
name = "hanomag-k55e"
version = "0.1.0"
description = "Parametrisches 1:8-Modell des Hanomag K 55 E mit FRISCH-55-FH2-Planierschild (build123d)"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["cad", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PIE", "RET"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # deutsche Texte mit Sonderzeichen (×, –, Ø) sind gewollt
    "N802", "N803", "N806",        # Konstruktionsformeln nutzen Grossbuchstaben fuer Punkte/Masse (P, R_TR, ...)
    "E741",                        # l/O als Laengen-/Punktnamen in Formeln
]

[tool.ruff.lint.isort]
known-first-party = ["cad"]

[tool.ruff.format]
quote-style = "double"
